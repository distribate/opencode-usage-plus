name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting
        run: swiftformat --lint .

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: make build

      - name: Build dmg
        run: make dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Usage-Plus-dmg
          path: OpenCode Usage Plus.dmg

  windows:
    name: Windows tray (build & test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish single-file exe
        run: >
          dotnet publish src/OpenCodeUsagePlus -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          -o publish

      - name: Zip
        run: Compress-Archive -Path publish\OpenCodeUsagePlus.exe -DestinationPath OpenCodeUsagePlus-windows-x64.zip -Force

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Usage-Plus-windows-x64
          path: windows/OpenCodeUsagePlus-windows-x64.zip
